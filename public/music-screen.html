<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>МузЛото — Экран ТВ</title>
  <link rel="stylesheet" href="style.css?v=3">
  <link rel="stylesheet" href="stream-theme.css?v=5">
  <style>
    #music-enable { position: relative; z-index: 10002; }
    .music-card-title { color: #fff; font-size: .8rem; }
    #music-winning-card .showcase-cover-img { width: 100%; height: 100%; object-fit: cover; opacity: .36; }
    #music-placeholder:not([hidden]) { display: flex; }
    #tv-stage-cover:not([hidden]) { display: block; }
  </style>
</head>
<body class="host-page">
  <div class="wrap">
    <header class="stream-header host-header">
      <a class="stream-brand" href="index.html" aria-label="МузЛото · главная">
        <span class="brand-signal" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        <span>МузЛото</span>
      </a>
      <div class="stream-header-actions host-header-actions">
        <span id="music-status" role="status">Ждём ведущего</span>
        <button id="music-enable" class="btn btn-gold" type="button">Включить звук на ТВ</button>
      </div>
    </header>
    <p id="music-waiting" class="card">Ждём комнату ведущего…</p>
    <section id="music-lobby" hidden>
      <div class="host-heading"><h1>Лобби</h1></div>
      <div class="tv-lobby-grid stream-lobby-grid">
        <section class="card lobby-invite">
          <div class="lobby-code-copy">
            <h2>Вход в игру</h2>
            <div class="code-display" id="music-code"></div>
            <p>Код комнаты</p>
          </div>
          <div id="lobby-qr-container" aria-label="QR-код входа" style="background:#fff;padding:12px;border-radius:16px"></div>
          <p class="lobby-join-url" id="music-join"></p>
        </section>
        <section class="card lobby-guest-panel">
          <h2>Игроки <span id="music-player-count" class="quantity-pill">0</span></h2>
          <div id="music-players" class="players-pill-wrap"></div>
        </section>
      </div>
    </section>
    <section id="music-stage" hidden>
      <div class="card stage-card">
        <div class="stage-toolbar">
          <div class="stage-chips">
            <span class="badge" id="music-turn"></span>
            <span class="stage-remaining" id="music-remaining"></span>
          </div>
        </div>
        <div class="lotto-stage">
          <div class="tv-hero-stage-row">
            <div class="barrel-column">
              <div class="lotto-keg-container">
                <div class="lotto-keg-halo"></div>
                <div class="lotto-keg-ball">
                  <div class="lotto-keg-label">Бочонок</div>
                  <div class="lotto-keg-number" id="lotto-keg-number">?</div>
                </div>
              </div>
            </div>
            <div class="cover-column">
              <div class="tv-album-cover-box">
                <img id="tv-stage-cover" class="tv-stage-cover-img" alt="Обложка трека" hidden>
                <div id="music-placeholder" class="tv-stage-cover-placeholder">
                  <span class="brand-signal" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
                </div>
              </div>
              <div class="tv-track-meta">
                <div class="tv-track-artist" id="music-track-artist"></div>
                <div class="tv-track-title" id="music-track-title"></div>
                <div class="equalizer-wave" id="equalizer-wave" aria-hidden="true">
                  <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
                  <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
                  <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
                </div>
                <div class="stage-progress">
                  <input id="music-progress" type="range" min="0" max="30" step="any" value="0" disabled aria-label="Позиция воспроизведения">
                  <div class="stage-time"><span id="music-elapsed">0:00</span><span id="music-duration">0:00</span></div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <section class="stage-history" aria-labelledby="music-history-title">
          <div class="stream-section-heading">
            <h2 id="music-history-title">Уже выпали <span id="music-history-count" class="quantity-pill">0</span></h2>
          </div>
          <div class="call-board" id="music-history" tabindex="0" role="region" aria-labelledby="music-history-title"></div>
        </section>
      </div>
    </section>
    <section id="music-winner" class="win-showcase-overlay" aria-labelledby="music-winner-name">
      <h1>БИНГО!</h1>
      <h2 id="music-winner-name"></h2>
      <div id="music-winning-card" class="card-showcase-grid size-3"></div>
    </section>
  </div>
  <audio id="music-audio" preload="auto"></audio>
  <script src="mqtt.min.js"></script>
  <script src="room-mqtt.js?v=2"></script>
  <script src="qrcode.min.js"></script>
  <script src="cloud-audio-config.js?v=3"></script>
  <script type="module" src="music-screen.mjs?v=1"></script>
</body>
</html>
