<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>МузЛото — Студия записи геймплея</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #08090e;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #fff;
      display: flex;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
    }
    
    /* Left side: TV Screen */
    .tv-wrapper {
      flex: 1.25;
      height: 100%;
      border-right: 2px solid rgba(251, 191, 36, 0.2);
      display: flex;
      flex-direction: column;
      background: #0a0c14;
      position: relative;
    }
    .tv-header-bar {
      height: 40px;
      background: linear-gradient(90deg, #121522 0%, #171b2a 100%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .tv-header-title {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fbbf24;
    }
    .tv-frame {
      width: 100%;
      height: calc(100% - 40px);
      border: none;
    }

    /* Right side: Players Arena */
    .arena-wrapper {
      flex: 0.95;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #06070a;
      padding: 16px;
      gap: 16px;
    }
    .arena-header {
      height: 44px;
      background: rgba(23, 27, 42, 0.8);
      border: 1px solid rgba(251, 191, 36, 0.2);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }
    .arena-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 800;
      color: #fbbf24;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .arena-status {
      font-size: 12px;
      color: #94a3b8;
    }

    .phones-container {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      height: calc(100% - 60px);
    }

    .phone-mockup {
      background: #0f121d;
      border: 3px solid #2a3146;
      border-radius: 28px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.05);
      position: relative;
    }
    .phone-mockup.p1 {
      border-color: rgba(251, 191, 36, 0.4);
    }
    .phone-mockup.p2 {
      border-color: rgba(168, 85, 247, 0.4);
    }

    .phone-notch-bar {
      height: 38px;
      background: #171b29;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-size: 12px;
      font-weight: 700;
    }
    .phone-label {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .phone-frame {
      width: 100%;
      height: calc(100% - 38px);
      border: none;
      background: #090a10;
    }
  </style>
</head>
<body>
  <!-- Left Side: TV Host Screen -->
  <div class="tv-wrapper">
    <div class="tv-header-bar">
      <div class="tv-header-title">
        <span>📺</span>
        <span>МУЗЛОТО · ГЛАВНЫЙ ЭКРАН ТЕЛЕВИЗОРА / ВЕДУЩЕГО</span>
      </div>
      <div style="color: #64748b; font-size: 11px;">1080p Full HD · 60 FPS</div>
    </div>
    <iframe id="tv-frame" class="tv-frame" src="http://localhost:3000/tv.html"></iframe>
  </div>

  <!-- Right Side: Dual Players Screen -->
  <div class="arena-wrapper">
    <div class="arena-header">
      <div class="arena-badge">
        <span>👥</span>
        <span>АРЕНА ИГРОКОВ (СМАРТФОНЫ)</span>
      </div>
      <div class="arena-status" id="arena-live-status">🟢 Подключение к Socket.IO...</div>
    </div>

    <div class="phones-container">
      <!-- Player 1 Phone -->
      <div class="phone-mockup p1">
        <div class="phone-notch-bar">
          <div class="phone-label" style="color: #fbbf24;">
            <span>📱</span>
            <span>Игрок 1: Гриша</span>
          </div>
          <span style="color: #22c55e; font-size: 10px;">● ОНЛАЙН</span>
        </div>
        <iframe id="p1-frame" class="phone-frame" src="http://localhost:3000/play.html"></iframe>
      </div>

      <!-- Player 2 Phone -->
      <div class="phone-mockup p2">
        <div class="phone-notch-bar">
          <div class="phone-label" style="color: #c084fc;">
            <span>📱</span>
            <span>Игрок 2: Даша</span>
          </div>
          <span style="color: #22c55e; font-size: 10px;">● ОНЛАЙН</span>
        </div>
        <iframe id="p2-frame" class="phone-frame" src="http://localhost:3000/play.html"></iframe>
      </div>
    </div>
  </div>
</body>
</html>
