<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>МузЛото — Карточка игрока</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>">
  <style>
    html, body {
      height: 100%;
      overflow-x: hidden;
      background-color: #07080c;
      background-image: 
        linear-gradient(180deg, rgba(7, 8, 12, 0.88) 0%, rgba(7, 8, 12, 0.96) 100%),
        url('assets/bg.jpg');
      background-size: cover;
      background-position: center top;
      background-attachment: fixed;
    }
    .player-app-shell {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      padding: 10px 12px 18px 12px;
      box-sizing: border-box;
    }
    .compact-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 2px 10px 2px;
      flex-shrink: 0;
    }
    .player-profile-pill {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .player-avatar-circle {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, #36e979 0%, #b45309 100%);
      color: #090a0f;
      font-weight: 900;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 10px rgba(54,233,121, 0.4);
      flex-shrink: 0;
    }
    .compact-status-card {
      background: #0f121d;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 9px 12px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }
    .proximity-badge {
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      padding: 4px 14px;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.09);
      color: #c2e6cb;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .proximity-badge.urgent {
      background: rgba(54,233,121, 0.2);
      border-color: #4bea83;
      color: #a6f5be;
      box-shadow: 0 0 14px rgba(54,233,121, 0.4);
      animation: pulseUrgent 1s infinite alternate;
    }
    @keyframes pulseUrgent {
      from { transform: scale(0.98); }
      to { transform: scale(1.02); }
    }
    .sticky-bottom-actions {
      margin-top: auto;
      padding-top: 10px;
      flex-shrink: 0;
    }
    #confetti-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10001;
    }
  </style>
  <link rel="stylesheet" href="stream-theme.css?v=1">
</head>
<body class="player-page">
  <canvas id="confetti-canvas"></canvas>

  <div class="player-app-shell">
    <!-- SECTION 1: JOIN ROOM -->
    <section id="sec-join" style="margin: auto 0; padding: 20px 0;">
      <div class="player-join-heading">
        <span class="brand-signal" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        <h1>МузЛото</h1>
        <p>Вход игрока</p>
      </div>

      <div class="card player-join-card">
        <div style="display:flex; flex-direction:column; gap: 16px;">
          <label>
            Имя или ник
            <input id="input-name" type="text" placeholder="Ваше имя" maxlength="20" autocomplete="name" style="margin-top:6px;">
          </label>
          <label>
            Код комнаты
            <input id="input-room" type="text" placeholder="7937" inputmode="numeric" maxlength="6" style="margin-top:6px; font-family:var(--font-mono); font-size:1.4rem; letter-spacing:0.15em; text-align:center;">
          </label>
          <button id="btn-join" class="btn btn-gold" style="padding: 15px; font-size:1.05rem; margin-top:6px; font-weight:800; letter-spacing:0.04em;">
            <span>Войти в игру</span>
          </button>
        </div>
      </div>

      <div style="text-align:center; margin-top: 24px;">
        <a href="index.html" style="color:var(--text-muted); font-size:0.85rem; text-decoration:none; opacity:0.8;">← На главную</a>
      </div>
    </section>

    <!-- SECTION 2: PLAYER BINGO CARD -->
    <section id="sec-play" style="display:none; flex-direction:column; flex:1;">
      <div class="player-brand stream-brand">
        <span class="brand-signal" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        <span>МузЛото</span>
      </div>
      <!-- Compact Top Bar -->
      <div class="compact-bar">
        <div class="player-profile-pill">
          <div class="player-avatar-circle" id="player-avatar-initial">И</div>
          <div>
            <div style="font-weight:900; font-size:0.95rem; color:#fff; line-height:1.1;" id="player-display-name">Игрок</div>
            <div class="mono" style="font-size:0.72rem; color:#4bea83; letter-spacing:0.04em;" id="room-code-badge">Комната #----</div>
          </div>
        </div>
        <div class="row" style="gap:8px; align-items:center;">
          <div class="badge" id="mode-badge" style="margin-bottom:0; font-size:0.72rem; padding: 4px 10px; background:rgba(54,233,121,0.14); border-color:rgba(54,233,121,0.35); color:#a6f5be; font-weight:700;">
            Вся карточка
          </div>
          <button id="btn-leave-room" class="btn btn-secondary btn-sm" style="display:none; padding:4px 8px; font-size:0.72rem; color:var(--text-muted);" title="Сменить имя или комнату">Выйти</button>
        </div>
      </div>

      <!-- Compact Live Status Banner -->
      <div class="compact-status-card">
        <div style="display:flex; align-items:center; gap:8px;">
          <div class="soundwave-indicator" id="soundwave-indicator" style="display:none;">
            <div class="soundwave-bar"></div>
            <div class="soundwave-bar"></div>
            <div class="soundwave-bar"></div>
            <div class="soundwave-bar"></div>
          </div>
          <div>
            <div id="game-banner-status" style="font-weight:700; font-size:0.85rem; color:#fff; line-height:1.2;">
              Ожидание старта игры на ТВ
            </div>
            <div id="game-banner-sub" style="font-size:0.7rem; color:var(--text-muted); margin-top:1px;">
              Ведущий настраивает бочонки в мешке
            </div>
          </div>
        </div>
        <div id="game-banner-meta" class="mono" style="font-size:0.75rem; color:#4bea83; font-weight:800; text-align:right; white-space:nowrap;">
          0 / 0
        </div>
      </div>

      <!-- Proximity Indicator -->
      <div style="text-align:center; margin-bottom: 8px;">
        <span class="proximity-badge" id="proximity-badge">
          Слушайте трек и отмечайте клетки с номером бочонка
        </span>
      </div>

      <!-- The Responsive Bingo Grid with Album Artwork -->
      <h1 class="player-card-title">Моя карточка</h1>
      <div id="bingo-grid" class="bingo-grid size-3"></div>

      <!-- Bottom Actions & Bingo Button -->
      <div class="sticky-bottom-actions">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 8px; font-size:0.78rem; color:var(--text-muted); padding: 0 4px;">
          <span>Отмечено: <b id="marks-count-text" style="color:#4bea83; font-weight:800;">0 из 9</b></span>
          <span style="font-size:0.72rem;">Нажмите на клетку для отметки</span>
        </div>
        <button id="btn-bingo" class="btn-bingo" disabled>
          <span>Линия ещё не закрыта</span>
        </button>
      </div>
    </section>
  </div>

  <div id="toast" class="toast-msg"></div>

  <!-- Libraries -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="mqtt.min.js"></script>
  <script src="peerjs.min.js"></script>
  <script src="comm.js?v=2"></script>

  <script>
    const $ = id => document.getElementById(id);
    const comm = window.createComm('player');
    const urlParams = new URLSearchParams(window.location.search);

    let joinedCode = null;
    let myPlayerName = '';
    let myPlayerPid = null;
    let myCard = [];
    let myMarks = new Set();
    let calledTrackIds = new Set();
    let currentGameState = 'lobby';
    let currentMode = 'full';
    let gridSize = 3;

    $('input-room').value = urlParams.get('room') || '';
    $('input-name').value = localStorage.getItem('muzloto_player_name') || '';

    // Web Audio Sounds
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTapSound(isMarking) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(isMarking ? 659.25 : 440.0, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.14);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
      } catch(e) {}
    }

    function playRefusalSound() {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(75, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.21);
      } catch(e) {}
    }

    function playWinSound() {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.1);
          gain.gain.setValueAtTime(0, audioCtx.currentTime + idx * 0.1);
          gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + idx * 0.1 + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.1 + 0.6);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(audioCtx.currentTime + idx * 0.1);
          osc.stop(audioCtx.currentTime + idx * 0.1 + 0.7);
        });
      } catch(e) {}
    }

    function toast(text) {
      const el = $('toast');
      el.textContent = text;
      el.style.display = 'block';
      clearTimeout(el._t);
      el._t = setTimeout(() => { el.style.display = 'none'; }, 3500);
    }

    // Dynamic cover art with bespoke vinyl fallback
    function getCoverArt(art) {
      if (art && typeof art === 'string' && art.length > 5) {
        return art;
      }
      return "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23111420'/><circle cx='50' cy='50' r='45' fill='%23171b26' stroke='%232a3044' stroke-width='1.5'/><circle cx='50' cy='50' r='32' fill='none' stroke='%23222736' stroke-width='1'/><circle cx='50' cy='50' r='18' fill='%2336e979'/><circle cx='50' cy='50' r='5' fill='%2308090e'/><text x='50' y='53' fill='%23000' font-size='8' font-weight='900' text-anchor='middle' font-family='sans-serif'>♪</text></svg>";
    }

    function joinGame() {
      const code = $('input-room').value.trim();
      const name = $('input-name').value.trim();

      if (!code) return toast('Пожалуйста, введите код с экрана ТВ');
      if (!name) return toast('Пожалуйста, введите ваше имя');

      // Use tab-isolated sessionStorage so multiple players/tabs never collide
      const sessionKey = 'muzloto_session_pid_' + code;
      let sessionPid = sessionStorage.getItem(sessionKey);
      if (!sessionPid) {
        sessionPid = 'p_' + Math.random().toString(36).slice(2, 10) + '_' + Date.now().toString(36);
        sessionStorage.setItem(sessionKey, sessionPid);
      }

      const joinBtn = $('btn-join');
      joinBtn.disabled = true;
      joinBtn.querySelector('span').textContent = 'Подключение…';

      comm.playerJoin({ code, name, pid: sessionPid }, res => {
        joinBtn.disabled = false;
        joinBtn.querySelector('span').textContent = 'Войти в игру';

        if (res.error) return toast(res.error);

        sessionStorage.setItem(sessionKey, res.pid);
        sessionStorage.setItem('muzloto_session_pid', res.pid);
        sessionStorage.setItem('muzloto_player_card_' + code, JSON.stringify(res));
        localStorage.setItem('muzloto_player_name', name);
        localStorage.setItem('muzloto_joined_room', code);
        joinedCode = code;
        myPlayerName = name;
        myPlayerPid = res.pid;
        currentMode = res.mode || 'full';

        $('player-display-name').textContent = name;
        $('player-avatar-initial').textContent = (name.charAt(0) || 'И').toUpperCase();
        $('room-code-badge').textContent = `Комната #${code}`;
        const modeText = (res.mode === 'full') ? 'Вся карточка' : (res.mode === 'two_lines' ? '2 Линии' : 'Линия');
        $('mode-badge').textContent = modeText;

        $('sec-join').style.display = 'none';
        $('sec-play').style.display = 'flex';
        $('btn-leave-room').style.display = 'inline-flex';

        renderCard(res);
      });
    }

    $('btn-join').onclick = joinGame;

    function renderCard(data) {
      myCard = data.card || [];
      myMarks = new Set(data.marks || []);
      gridSize = Math.sqrt(myCard.length) || 3;
      const grid = $('bingo-grid');

      grid.className = `bingo-grid size-${gridSize}`;
      grid.innerHTML = myCard.map(item => {
        const isMarked = myMarks.has(item.id);
        const coverSrc = getCoverArt(item.art);
        return `
          <div class="bingo-cell ${isMarked ? 'marked' : ''}" data-id="${item.id}" role="button" aria-pressed="${isMarked}">
            <div class="cell-cover-wrap">
              <img class="cell-cover-img" src="${coverSrc}" alt="" loading="lazy" onerror="this.onerror=null;this.src=getCoverArt('')">
              <div class="cell-cover-gradient"></div>
            </div>
            <div class="cell-content">
              <div class="cell-header">
                <span class="keg-number-badge">№ ${item.kegNum}</span>
                <span class="cell-stamp" aria-hidden="true">✓</span>
              </div>
              <div class="cell-meta">
                <div class="cell-artist-badge">${escapeHtml(item.artist || 'Хит')}</div>
                <div class="cell-title">${escapeHtml(item.title)}</div>
              </div>
            </div>
          </div>
        `;
      }).join('');

      updateProgress();
      updateReadyToStamp();

      grid.querySelectorAll('.bingo-cell').forEach(cell => {
        cell.onclick = () => {
          if (currentGameState !== 'playing') {
            toast('Отмечать бочонки можно только во время звучания треков');
            return;
          }
          const id = cell.dataset.id;
          const willMark = !cell.classList.contains('marked');

          // Strict Anti-Cheat: cannot stamp an uncalled barrel!
          if (willMark && !calledTrackIds.has(id)) {
            toast('Этот бочонок ещё не выпал на ТВ! Жульничать нельзя 😉');
            playRefusalSound();
            cell.classList.add('cell-shake');
            setTimeout(() => cell.classList.remove('cell-shake'), 400);
            return;
          }

          if (willMark) {
            cell.classList.add('marked');
            cell.classList.remove('ready-to-stamp');
            myMarks.add(id);
          } else {
            cell.classList.remove('marked');
            if (calledTrackIds.has(id)) cell.classList.add('ready-to-stamp');
            myMarks.delete(id);
          }

          // Persist marks in sessionStorage so refresh retains them immediately
          if (joinedCode) {
            try {
              const cached = JSON.parse(sessionStorage.getItem('muzloto_player_card_' + joinedCode) || '{}');
              cached.marks = [...myMarks];
              sessionStorage.setItem('muzloto_player_card_' + joinedCode, JSON.stringify(cached));
            } catch(e) {}
          }

          comm.playerMark({ id, marked: willMark });
          playTapSound(willMark);
          if (navigator.vibrate) navigator.vibrate(35);
          updateProgress();
        };
      });
    }

    function calculateMinRemainingToWin() {
      const n = gridSize;
      const R = [...Array(n).keys()];
      const isMarked = idx => myMarks.has(myCard[idx].id);

      if (currentMode === 'full') {
        return myCard.filter((_, i) => !isMarked(i)).length;
      }

      const lines = [];
      for (let i = 0; i < n; i++) lines.push(R.map(j => i * n + j));
      for (let j = 0; j < n; j++) lines.push(R.map(i => i * n + j));
      lines.push(R.map(j => j * n + j));
      lines.push(R.map(j => j * n + (n - 1 - j)));

      if (currentMode === 'two_lines') {
        let minNeeded = n * 2;
        for (let a = 0; a < lines.length; a++) {
          for (let b = a + 1; b < lines.length; b++) {
            const unionSet = new Set([...lines[a], ...lines[b]]);
            const missing = [...unionSet].filter(idx => !isMarked(idx)).length;
            if (missing < minNeeded) minNeeded = missing;
          }
        }
        return minNeeded;
      }

      let minRemaining = n;
      for (const line of lines) {
        const missing = line.filter(idx => !isMarked(idx)).length;
        if (missing < minRemaining) minRemaining = missing;
      }
      return minRemaining;
    }

    function formatKegsCount(n) {
      const mod10 = n % 10;
      const mod100 = n % 100;
      if (mod100 >= 11 && mod100 <= 19) return `${n} бочонков`;
      if (mod10 === 1) return `${n} бочонок`;
      if (mod10 >= 2 && mod10 <= 4) return `${n} бочонка`;
      return `${n} бочонков`;
    }

    function updateProgress() {
      $('marks-count-text').textContent = `${myMarks.size} из ${myCard.length}`;

      const minToWin = calculateMinRemainingToWin();
      const badge = $('proximity-badge');
      const bingoBtn = $('btn-bingo');

      const modeLabel = (currentMode === 'full') ? 'всей карточки' : (currentMode === 'two_lines' ? 'двух линий' : 'победной линии');

      if (minToWin === 0) {
        badge.className = 'proximity-badge urgent';
        badge.textContent = (currentMode === 'full') ? 'Карточка закрыта — жмите Бинго!' : (currentMode === 'two_lines' ? '2 Линии закрыты — жмите Бинго!' : 'Линия закрыта — жмите Бинго!');
        bingoBtn.classList.add('ready');
        bingoBtn.disabled = false;
        bingoBtn.querySelector('span').textContent = 'Бинго!';
      } else if (minToWin === 1) {
        badge.className = 'proximity-badge urgent';
        badge.textContent = `Остался 1 бочонок до ${modeLabel}`;
        bingoBtn.classList.remove('ready');
        bingoBtn.disabled = true;
        bingoBtn.querySelector('span').textContent = 'Ещё не закрыто';
      } else {
        badge.className = 'proximity-badge';
        badge.textContent = `До ${modeLabel}: ${formatKegsCount(minToWin)}`;
        bingoBtn.classList.remove('ready');
        bingoBtn.disabled = true;
        bingoBtn.querySelector('span').textContent = 'Ещё не закрыто';
      }
    }

    $('btn-bingo').onclick = () => {
      comm.playerBingo({ marks: [...myMarks] }, res => {
        if (res.ok) {
          toast('Бинго принято! Ваша карточка проверяется на ТВ');
          playWinSound();
          startConfetti();
        } else {
          toast(res.msg || 'Пока не бинго');
        }
      });
    };

    comm.on('state', state => {
      if (!joinedCode) return;
      currentGameState = state.state;

      if (state.called && Array.isArray(state.called)) {
        calledTrackIds = new Set(state.called);
      } else if (state.calledHistory && Array.isArray(state.calledHistory)) {
        calledTrackIds = new Set(state.calledHistory.map(h => h.id));
      }
      updateReadyToStamp();

      const banner = $('game-banner-status');
      const bannerSub = $('game-banner-sub');
      const meta = $('game-banner-meta');
      const soundwave = $('soundwave-indicator');
      const bingoBtn = $('btn-bingo');

      meta.textContent = `${state.calledCount} / ${state.totalCount}`;

      if (state.state === 'lobby') {
        banner.textContent = 'Ожидание старта раунда на ТВ';
        bannerSub.textContent = 'Ведущий скоро запустит игру';
        soundwave.style.display = 'none';
        bingoBtn.disabled = true;
      } else if (state.state === 'playing') {
        banner.textContent = 'Слушайте трек и сверяйте бочонки';
        bannerSub.textContent = state.currentTrack ? `Сейчас звучит бочонок № ${state.currentTrack.kegNum}` : 'Песня играет на ТВ';
        soundwave.style.display = 'inline-flex';
        updateProgress();
      } else if (state.state === 'finished') {
        soundwave.style.display = 'none';
        if (state.winner) {
          const isWinner = (state.winnerPid && myPlayerPid)
            ? (state.winnerPid === myPlayerPid)
            : (state.winnerDetails && state.winnerDetails.pid && myPlayerPid)
              ? (state.winnerDetails.pid === myPlayerPid)
              : (state.winner === myPlayerName);

          if (isWinner) {
            banner.textContent = 'Победа! Ваша карточка на ТВ';
            bannerSub.textContent = 'Все проверено, вы чемпион этого раунда!';
            playWinSound();
            startConfetti();
          } else {
            banner.textContent = `Победитель: ${state.winner}`;
            bannerSub.textContent = 'Раунд завершён. Ждём следующий раунд.';
          }
        } else {
          banner.textContent = 'Раунд завершён';
          bannerSub.textContent = 'Все бочонки разыграны';
        }
        bingoBtn.disabled = true;
        bingoBtn.classList.remove('ready');
        bingoBtn.querySelector('span').textContent = 'Раунд завершён';
      }
    });

    function updateReadyToStamp() {
      const grid = $('bingo-grid');
      if (!grid) return;
      grid.querySelectorAll('.bingo-cell').forEach(cell => {
        const id = cell.dataset.id;
        if (calledTrackIds.has(id) && !cell.classList.contains('marked')) {
          cell.classList.add('ready-to-stamp');
        } else {
          cell.classList.remove('ready-to-stamp');
        }
      });
    }

    function checkPlayerAutoRestore() {
      const urlRoom = urlParams.get('room');
      const savedCode = urlRoom || localStorage.getItem('muzloto_joined_room');
      const savedName = localStorage.getItem('muzloto_player_name');
      if (!savedCode || !savedName) return;

      const cachedCardJson = sessionStorage.getItem('muzloto_player_card_' + savedCode);
      if (cachedCardJson) {
        try {
          const cached = JSON.parse(cachedCardJson);
          joinedCode = savedCode;
          myPlayerName = savedName;
          myPlayerPid = cached.pid || sessionStorage.getItem('muzloto_session_pid_' + savedCode);
          currentMode = cached.mode || 'full';

          $('player-display-name').textContent = savedName;
          $('player-avatar-initial').textContent = (savedName.charAt(0) || 'И').toUpperCase();
          $('room-code-badge').textContent = `Комната #${savedCode}`;
          $('mode-badge').textContent = (currentMode === 'full') ? 'Вся карточка' : (currentMode === 'two_lines' ? '2 Линии' : 'Линия');

          $('sec-join').style.display = 'none';
          $('sec-play').style.display = 'flex';
          $('btn-leave-room').style.display = 'inline-flex';

          renderCard(cached);
        } catch(e) {}
      }

      const sessionKey = 'muzloto_session_pid_' + savedCode;
      let sessionPid = sessionStorage.getItem(sessionKey) || sessionStorage.getItem('muzloto_session_pid');
      if (!sessionPid) {
        sessionPid = 'p_' + Math.random().toString(36).slice(2, 10) + '_' + Date.now().toString(36);
        sessionStorage.setItem(sessionKey, sessionPid);
      }

      comm.playerJoin({ code: savedCode, name: savedName, pid: sessionPid }, res => {
        if (res.error) {
          localStorage.removeItem('muzloto_joined_room');
          $('sec-join').style.display = 'block';
          $('sec-play').style.display = 'none';
          $('btn-leave-room').style.display = 'none';
          return;
        }

        sessionStorage.setItem(sessionKey, res.pid);
        sessionStorage.setItem('muzloto_session_pid', res.pid);
        sessionStorage.setItem('muzloto_player_card_' + savedCode, JSON.stringify(res));
        localStorage.setItem('muzloto_joined_room', savedCode);

        joinedCode = savedCode;
        myPlayerName = savedName;
        myPlayerPid = res.pid;
        currentMode = res.mode || 'full';

        $('player-display-name').textContent = savedName;
        $('player-avatar-initial').textContent = (savedName.charAt(0) || 'И').toUpperCase();
        $('room-code-badge').textContent = `Комната #${savedCode}`;
        $('mode-badge').textContent = (currentMode === 'full') ? 'Вся карточка' : (currentMode === 'two_lines' ? '2 Линии' : 'Линия');

        $('sec-join').style.display = 'none';
        $('sec-play').style.display = 'flex';
        $('btn-leave-room').style.display = 'inline-flex';

        renderCard(res);
      });
    }

    function leaveRoom() {
      if (!confirm('Выйти из текущей комнаты?')) return;
      localStorage.removeItem('muzloto_joined_room');
      if (joinedCode) sessionStorage.removeItem('muzloto_player_card_' + joinedCode);
      joinedCode = null;
      $('sec-join').style.display = 'block';
      $('sec-play').style.display = 'none';
      $('btn-leave-room').style.display = 'none';
    }

    $('btn-leave-room').onclick = leaveRoom;
    checkPlayerAutoRestore();

    comm.on('card', data => {
      stopConfetti();
      renderCard(data);
    });

    // Confetti
    let confettiAnim = null;
    function startConfetti() {
      const canvas = $('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const count = 75;
      const particles = Array.from({ length: count }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height - canvas.height,
        r: Math.random() * 5 + 3,
        d: Math.random() * count,
        color: ['#4bea83', '#36e979', '#d97706', '#ec4899', '#38bdf8'][Math.floor(Math.random() * 5)],
        tilt: Math.floor(Math.random() * 10) - 10,
        tiltAngleInc: Math.random() * 0.07 + 0.05,
        tiltAngle: 0
      }));

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          ctx.beginPath();
          ctx.lineWidth = p.r / 2;
          ctx.strokeStyle = p.color;
          ctx.moveTo(p.x + p.tilt + p.r / 4, p.y);
          ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r / 4);
          ctx.stroke();
          p.tiltAngle += p.tiltAngleInc;
          p.y += (Math.cos(p.d) + 3 + p.r / 2) / 2;
          p.tilt = Math.sin(p.tiltAngle - p.d / 3) * 15;
          if (p.y > canvas.height) {
            p.y = -10;
            p.x = Math.random() * canvas.width;
          }
        });
        confettiAnim = requestAnimationFrame(draw);
      }
      draw();
    }

    function stopConfetti() {
      if (confettiAnim) cancelAnimationFrame(confettiAnim);
      const canvas = $('confetti-canvas');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
  </script>
