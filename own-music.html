<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Своя музыка — МузЛото</title>
  <link rel="stylesheet" href="style.css?v=3">
  <link rel="stylesheet" href="stream-theme.css?v=7">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>">
  <style>
    .own-main { max-width: 860px; margin: 0 auto; padding: 18px 14px 96px; display: grid; gap: 16px; }
    .own-main h1 { margin: 0; font-size: 1.6rem; }
    .own-main h2 { margin: 0 0 10px; font-size: 1.1rem; }
    .own-main p { margin: 0; color: var(--text-muted); line-height: 1.45; }
    .own-main .card { padding: 16px; display: grid; gap: 12px; }
    .own-main input[type=text], .own-main input[type=password] { width: 100%; min-height: 44px; padding: 8px 12px; border-radius: 10px;
      border: 1px solid var(--border-subtle); background: var(--bg-surface); color: inherit; font: inherit; }
    .own-main label > span { display: block; margin-bottom: 4px; color: var(--text-muted); font-size: .82rem; }
    .own-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .own-row .btn { min-height: 44px; }
    .own-note { font-size: .88rem; }
    .own-error { color: #ff8f8f; font-weight: 600; }
    .own-ok { color: var(--primary); font-weight: 600; }
    .own-packs { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
    .own-packs li { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between;
      padding: 10px 12px; border: 1px solid var(--border-subtle); border-radius: 12px; }
    .own-packs small { display: block; color: var(--text-muted); }
    .own-tracks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
    .own-tracks li { display: grid; grid-template-columns: 44px 1fr 44px; gap: 8px 10px; align-items: center;
      padding: 8px; border: 1px solid var(--border-subtle); border-radius: 12px; }
    .own-cover { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; background: var(--bg-surface);
      display: grid; place-items: center; color: var(--text-muted); }
    .own-fields { display: grid; gap: 6px; min-width: 0; }
    @media (min-width: 620px) { .own-fields { grid-template-columns: 1fr 1fr; } }
    .own-icon { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--border-subtle); background: transparent;
      color: inherit; font-size: 1rem; cursor: pointer; }
    .own-state { grid-column: 2 / 4; font-size: .8rem; color: var(--text-muted); }
    .own-state[data-state=stored] { color: var(--primary); }
    .own-state[data-state=failed] { color: #ff8f8f; }
    .own-file { position: relative; overflow: hidden; }
    .own-file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    [hidden] { display: none !important; }
  </style>
</head>
<body class="home-page">
  <header class="stream-header">
    <a class="stream-brand" href="muzloto.html" aria-label="МузЛото · главная">
      <span class="brand-signal" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
      <span>МузЛото</span>
    </a>
    <div class="stream-header-actions">
      <a href="tv.html" class="btn btn-secondary btn-sm">К созданию игры</a>
    </div>
  </header>

  <main class="own-main">
    <div>
      <h1>Своя музыка</h1>
      <p>Загрузите свои MP3: пак появится в подборках МузЛото и будет играть целиком.</p>
    </div>

    <form class="card" id="login" hidden>
      <h2>Вход владельца</h2>
      <label><span>Пароль владельца</span><input type="password" id="password" autocomplete="current-password" required></label>
      <div class="own-row"><button class="btn btn-gold" type="submit">Войти</button><span id="login-note" class="own-note own-error" role="alert"></span></div>
    </form>

    <section class="card" id="library" hidden>
      <div class="own-row" style="justify-content: space-between;">
        <h2 style="margin: 0;">Мои паки</h2>
        <button class="btn btn-gold" type="button" id="new-pack">+ Новый пак</button>
      </div>
      <p id="library-note" class="own-note" role="status"></p>
      <ul class="own-packs" id="packs"></ul>
      <div class="own-row"><button class="btn btn-secondary btn-sm" type="button" id="logout">Выйти</button></div>
    </section>

    <section class="card" id="editor" hidden>
      <h2 id="editor-title">Новый пак</h2>
      <label><span>Название пака</span><input type="text" id="pack-title" maxlength="60" placeholder="Например: Плейлист компании"></label>
      <div class="own-row">
        <label class="btn btn-secondary own-file">Добавить MP3<input type="file" id="files" accept=".mp3,.m4a,audio/mpeg,audio/mp4" multiple></label>
        <span class="own-note" id="count" role="status"></span>
      </div>
      <p class="own-note">Исполнитель и название берутся из файла: проверьте их, они будут на карточках игроков. Для карточек 3×3 нужно 9 треков, для 4×4 нужно 16.</p>
      <ul class="own-tracks" id="tracks"></ul>
      <p id="editor-note" class="own-note" role="status"></p>
      <div class="own-row">
        <button class="btn btn-gold" type="button" id="save">Сохранить пак</button>
        <button class="btn btn-secondary" type="button" id="cancel">Отмена</button>
      </div>
    </section>
  </main>

  <script src="cloud-audio-config.js?v=4"></script>
  <script>
    (() => {
      'use strict';
      const $ = id => document.getElementById(id);
      const config = window.MUZLOTO_CLOUD_AUDIO;
      const keyName = 'muzloto-owner-key';
      const formats = { mp3: 'audio/mpeg', m4a: 'audio/mp4' };
      const maxTracks = 150;
      const maxBytes = 40 * 1024 * 1024;
      const player = new Audio();
      let key = '';
      try { key = localStorage.getItem(keyName) || ''; } catch {}
      let packs = [];
      let links = new Map();
      let draft = null;
      let dirty = false;
      let busy = false;

      const hex = bytes => Array.from(crypto.getRandomValues(new Uint8Array(bytes)), b => b.toString(16).padStart(2, '0')).join('');
      const tidy = (value, limit) => String(value || '').replace(/\s+/g, ' ').trim().slice(0, limit);

      function show(view) {
        for (const id of ['login', 'library', 'editor']) $(id).hidden = id !== view;
      }

      async function call(body) {
        const response = await fetch(config.ownUrl, {
          method: 'POST',
          headers: { apikey: config.key, 'content-type': 'application/json', 'x-muzloto-key': key },
          body: JSON.stringify(body)
        });
        if (response.status === 403) {
          forget();
          $('login-note').textContent = 'Пароль не подошёл.';
          throw new Error('password');
        }
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw Object.assign(new Error(data.error || 'request'), { data });
        return data;
      }

      function forget() {
        key = '';
        try { localStorage.removeItem(keyName); } catch {}
        draft = null;
        dirty = false;
        show('login');
      }

      async function loadLibrary(note = '') {
        show('library');
        $('library-note').className = 'own-note';
        $('library-note').textContent = 'Загружаем список…';
        try {
          const response = await fetch(config.ownUrl, { headers: { apikey: config.key }, cache: 'no-store' });
          if (!response.ok) throw new Error('catalog');
          const data = await response.json();
          packs = data.packs;
          links = new Map(data.tracks.map(track => [track.id, track.url]));
          $('library-note').textContent = note || (packs.length ? '' : 'Пока нет ни одного пака. Нажмите «Новый пак».');
          if (note) $('library-note').className = 'own-note own-ok';
        } catch {
          $('library-note').className = 'own-note own-error';
          $('library-note').textContent = 'Не удалось загрузить список. Обновите страницу.';
        }
        renderLibrary();
      }

      function renderLibrary() {
        $('packs').replaceChildren(...packs.map(pack => {
          const item = document.createElement('li');
          const copy = document.createElement('div');
          const name = document.createElement('strong');
          name.textContent = pack.title;
          const size = document.createElement('small');
          size.textContent = `${pack.tracks.length} треков`;
          copy.append(name, size);
          const actions = document.createElement('div');
          actions.className = 'own-row';
          const play = document.createElement('a');
          play.className = 'btn btn-gold btn-sm';
          play.href = 'tv.html?pack=own_' + pack.id;
          play.textContent = 'Играть';
          const edit = button('Изменить', () => openEditor(pack));
          const drop = button('Удалить', () => removePack(pack));
          actions.append(play, edit, drop);
          item.append(copy, actions);
          return item;
        }));
      }

      function button(label, action) {
        const node = document.createElement('button');
        node.type = 'button';
        node.className = 'btn btn-secondary btn-sm';
        node.textContent = label;
        node.onclick = action;
        return node;
      }

      async function removePack(pack) {
        if (busy || !confirm(`Удалить пак «${pack.title}» и его ${pack.tracks.length} треков?`)) return;
        busy = true;
        try {
          await call({ action: 'delete', id: pack.id });
          await loadLibrary('Пак удалён.');
        } catch (error) {
          if (error.message !== 'password') {
            $('library-note').className = 'own-note own-error';
            $('library-note').textContent = 'Не удалось удалить пак. Попробуйте ещё раз.';
          }
        } finally { busy = false; }
      }

      function openEditor(pack) {
        draft = pack
          ? { id: pack.id, title: pack.title, tracks: pack.tracks.map(track => ({ ...track, state: 'stored' })) }
          : { id: 'p' + hex(6), title: '', tracks: [] };
        dirty = false;
        $('editor-title').textContent = pack ? 'Изменить пак' : 'Новый пак';
        $('pack-title').value = draft.title;
        $('editor-note').textContent = '';
        renderTracks();
        show('editor');
      }

      const stateText = track => track.state === 'stored' ? 'В облаке'
        : track.state === 'uploading' ? `Загрузка: ${track.progress || 0}%`
        : track.state === 'failed' ? 'Не загрузился: нажмите «Сохранить пак» ещё раз'
        : 'Загрузится при сохранении';

      function paintState(track) {
        const node = $('tracks').querySelector(`[data-state-of="${track.id}"]`);
        if (!node) return;
        node.dataset.state = track.state;
        node.textContent = stateText(track);
      }

      function paintCover(track) {
        const node = $('tracks').querySelector(`[data-cover-of="${track.id}"]`);
        if (!node) return;
        const cover = document.createElement(track.art ? 'img' : 'span');
        cover.className = 'own-cover';
        cover.dataset.coverOf = track.id;
        if (track.art) { cover.src = track.art; cover.alt = ''; } else cover.textContent = '♪';
        node.replaceWith(cover);
      }

      function renderTracks() {
        player.pause();
        $('count').textContent = draft.tracks.length ? `Треков: ${draft.tracks.length}` : 'Треков пока нет';
        $('tracks').replaceChildren(...draft.tracks.map(track => {
          const item = document.createElement('li');
          const cover = document.createElement('span');
          cover.dataset.coverOf = track.id;
          const fields = document.createElement('div');
          fields.className = 'own-fields';
          for (const [name, label] of [['artist', 'Исполнитель'], ['title', 'Название']]) {
            const input = document.createElement('input');
            input.type = 'text';
            input.maxLength = 80;
            input.placeholder = label;
            input.setAttribute('aria-label', label);
            input.value = track[name];
            input.oninput = () => { track[name] = input.value; dirty = true; };
            input.onchange = () => findCover(track);
            fields.append(input);
          }
          const tools = document.createElement('div');
          tools.style.cssText = 'display:grid;gap:6px;grid-row:1 / 3;grid-column:3;';
          const listen = document.createElement('button');
          listen.type = 'button';
          listen.className = 'own-icon';
          listen.textContent = '▶';
          listen.setAttribute('aria-label', 'Слушать');
          listen.onclick = () => preview(track, listen);
          const drop = document.createElement('button');
          drop.type = 'button';
          drop.className = 'own-icon';
          drop.textContent = '✕';
          drop.setAttribute('aria-label', 'Убрать трек');
          drop.onclick = () => {
            if (busy) return;
            draft.tracks = draft.tracks.filter(other => other !== track);
            dirty = true;
            renderTracks();
          };
          tools.append(listen, drop);
          const state = document.createElement('div');
          state.className = 'own-state';
          state.dataset.stateOf = track.id;
          item.append(cover, fields, tools, state);
          return item;
        }));
        for (const track of draft.tracks) { paintCover(track); paintState(track); }
      }

      function preview(track, control) {
        const source = track.file ? (track.blob ||= URL.createObjectURL(track.file)) : links.get(track.id);
        const playing = !player.paused && player.dataset.track === track.id;
        player.pause();
        for (const node of $('tracks').querySelectorAll('.own-icon[aria-label="Слушать"]')) node.textContent = '▶';
        if (playing || !source) return;
        player.dataset.track = track.id;
        player.src = source;
        player.play().then(() => { control.textContent = '❚❚'; }).catch(() => {});
      }

      // ID3v2 text frames; old Russian files keep Cyrillic as Windows-1251 under the "Latin-1" flag.
      function frameText(bytes) {
        if (!bytes.length) return '';
        const body = bytes.subarray(1);
        const high = body.reduce((count, byte) => count + (byte >= 0xc0), 0);
        const label = bytes[0] === 1 ? 'utf-16' : bytes[0] === 2 ? 'utf-16be' : bytes[0] === 3 ? 'utf-8'
          : high >= 2 ? 'windows-1251' : 'windows-1252';
        try { return new TextDecoder(label).decode(body).replace(/\0.*$/s, ''); } catch { return ''; }
      }

      async function readTags(file) {
        const found = {};
        try {
          const head = new Uint8Array(await file.slice(0, 10).arrayBuffer());
          if (head.length < 10 || head[0] !== 0x49 || head[1] !== 0x44 || head[2] !== 0x33) return found;
          const version = head[3];
          const size = (head[6] & 127) << 21 | (head[7] & 127) << 14 | (head[8] & 127) << 7 | (head[9] & 127);
          const data = new Uint8Array(await file.slice(10, 10 + Math.min(size, 6 * 1024 * 1024)).arrayBuffer());
          const idSize = version === 2 ? 3 : 4;
          const headSize = version === 2 ? 6 : 10;
          const names = version === 2 ? { TT2: 'title', TP1: 'artist' } : { TIT2: 'title', TPE1: 'artist' };
          for (let at = 0; at + headSize <= data.length && data[at];) {
            const id = String.fromCharCode(...data.subarray(at, at + idSize));
            const b = data.subarray(at + idSize, at + idSize + (version === 2 ? 3 : 4));
            const length = version === 2 ? b[0] << 16 | b[1] << 8 | b[2]
              : version === 4 ? (b[0] & 127) << 21 | (b[1] & 127) << 14 | (b[2] & 127) << 7 | (b[3] & 127)
              : (b[0] << 24 | b[1] << 16 | b[2] << 8 | b[3]) >>> 0;
            if (names[id]) found[names[id]] = frameText(data.subarray(at + headSize, at + headSize + length));
            if (found.title && found.artist) break;
            at += headSize + length;
          }
        } catch {}
        return found;
      }

      function fromName(name) {
        const base = name.replace(/\.[^.]+$/, '').replace(/_/g, ' ').replace(/^\s*\d{1,3}\s*[.)\-–—]?\s+/, '');
        const split = base.split(/\s+[-–—]\s+/);
        return split.length > 1 ? { artist: split[0], title: split.slice(1).join(' - ') } : { artist: '', title: base };
      }

      // Covers come from the public iTunes search, one request at a time: the service limits the rate.
      let coverQueue = Promise.resolve();
      function findCover(track) {
        const term = tidy(`${track.artist} ${track.title}`, 120);
        if (!term || term === track.coverTerm) return;
        track.coverTerm = term;
        coverQueue = coverQueue.then(async () => {
          if (!draft?.tracks.includes(track) || track.coverTerm !== term) return;
          try {
            const response = await fetch('https://itunes.apple.com/search?entity=song&limit=1&country=ru&term=' + encodeURIComponent(term));
            const art = response.ok ? (await response.json()).results?.[0]?.artworkUrl100 : '';
            track.art = /^https:\/\/[a-z0-9-]+\.mzstatic\.com\/[\w\-./%]{1,300}$/.test(art || '') ? art.replace('100x100bb', '400x400bb') : '';
          } catch { track.art = ''; }
          paintCover(track);
          await new Promise(resolve => setTimeout(resolve, 350));
        });
      }

      async function addFiles(files) {
        const notes = [];
        for (const file of files) {
          const ext = (/\.([a-z0-9]+)$/i.exec(file.name)?.[1] || '').toLowerCase();
          if (!formats[ext]) { notes.push(`«${file.name}»: нужен MP3 или M4A`); continue; }
          if (file.size > maxBytes) { notes.push(`«${file.name}»: больше 40 МБ`); continue; }
          if (draft.tracks.length >= maxTracks) { notes.push(`В паке не больше ${maxTracks} треков`); break; }
          const tags = ext === 'mp3' ? await readTags(file) : {};
          const named = fromName(file.name);
          const track = {
            id: 'u' + hex(8), ext, file, art: '', state: 'new',
            artist: tidy(tags.artist || named.artist, 80), title: tidy(tags.title || named.title, 80)
          };
          draft.tracks.push(track);
          findCover(track);
        }
        dirty = true;
        $('editor-note').className = 'own-note' + (notes.length ? ' own-error' : '');
        $('editor-note').textContent = notes.join('. ');
        renderTracks();
      }

      function send(track, url) {
        return new Promise((resolve, reject) => {
          const request = new XMLHttpRequest();
          request.open('PUT', url);
          request.setRequestHeader('content-type', formats[track.ext]);
          request.setRequestHeader('x-upsert', 'true');
          request.upload.onprogress = event => {
            if (!event.lengthComputable) return;
            track.progress = Math.round(event.loaded / event.total * 100);
            paintState(track);
          };
          request.onload = () => request.status >= 200 && request.status < 300 ? resolve() : reject(new Error('upload'));
          request.onerror = request.onabort = () => reject(new Error('upload'));
          request.send(track.file);
        });
      }

      async function uploadTrack(track) {
        track.state = 'uploading';
        track.progress = 0;
        paintState(track);
        try {
          const { url } = await call({ action: 'upload', pack: draft.id, track: track.id, ext: track.ext });
          await send(track, url);
          track.state = 'stored';
        } catch (error) {
          track.state = 'failed';
          if (error.message === 'password') throw error;
        }
        paintState(track);
      }

      async function savePack() {
        if (busy) return;
        const note = $('editor-note');
        const fail = text => { note.className = 'own-note own-error'; note.textContent = text; };
        draft.title = tidy($('pack-title').value, 60);
        if (!draft.title) return fail('Дайте паку название.');
        if (!draft.tracks.length) return fail('Добавьте хотя бы один трек.');
        if (draft.tracks.some(track => !tidy(track.title, 80))) return fail('У каждого трека должно быть название.');
        busy = true;
        $('save').disabled = true;
        note.className = 'own-note';
        try {
          const waiting = draft.tracks.filter(track => track.state !== 'stored');
          const total = waiting.length;
          let done = 0;
          const next = async () => {
            for (let track; (track = waiting.shift());) {
              note.textContent = `Загружаем треки: ${done} из ${total}…`;
              await uploadTrack(track);
              done++;
            }
          };
          await Promise.all([next(), next()]);
          const failed = draft.tracks.filter(track => track.state !== 'stored').length;
          if (failed) return fail(`Не загрузились треки: ${failed}. Нажмите «Сохранить пак» ещё раз.`);
          note.textContent = 'Сохраняем пак…';
          await call({ action: 'save', pack: {
            id: draft.id, title: draft.title,
            tracks: draft.tracks.map(track => ({
              id: track.id, ext: track.ext, art: track.art || '', artist: tidy(track.artist, 80), title: tidy(track.title, 80)
            }))
          } });
          const count = draft.tracks.length;
          draft = null;
          dirty = false;
          await loadLibrary(`Пак сохранён: ${count} треков. Он уже в подборках при создании игры.` +
            (count < 9 ? ' Для игры нужно минимум 9 треков.' : count < 16 ? ' Для карточек 4×4 нужно 16 треков.' : ''));
        } catch (error) {
          if (error.message !== 'password') fail('Не удалось сохранить пак. Проверьте интернет и нажмите «Сохранить пак» ещё раз.');
        } finally {
          busy = false;
          $('save').disabled = false;
        }
      }

      $('login').onsubmit = async event => {
        event.preventDefault();
        key = $('password').value;
        $('login-note').textContent = '';
        try {
          await call({ action: 'check' });
          try { localStorage.setItem(keyName, key); } catch {}
          $('password').value = '';
          loadLibrary();
        } catch (error) {
          if (error.message !== 'password') $('login-note').textContent = 'Нет связи с облаком. Попробуйте ещё раз.';
        }
      };
      $('logout').onclick = forget;
      $('new-pack').onclick = () => openEditor(null);
      $('files').onchange = event => {
        const files = Array.from(event.target.files);
        event.target.value = '';
        if (!busy) addFiles(files);
      };
      $('pack-title').oninput = () => { dirty = true; };
      $('save').onclick = savePack;
      $('cancel').onclick = () => {
        if (busy || (dirty && !confirm('Закрыть без сохранения? Добавленные треки не сохранятся.'))) return;
        player.pause();
        draft = null;
        dirty = false;
        loadLibrary();
      };
      player.onended = player.onpause = () => {
        for (const node of document.querySelectorAll('.own-icon[aria-label="Слушать"]')) node.textContent = '▶';
      };
      window.addEventListener('beforeunload', event => { if (dirty) event.preventDefault(); });

      if (!config?.ownUrl) {
        show('login');
        $('login-note').textContent = 'Облако с музыкой не настроено.';
      } else if (key) {
        call({ action: 'check' }).then(() => loadLibrary(), error => {
          if (error.message === 'password') return;
          show('login');
          $('login-note').textContent = 'Нет связи с облаком. Обновите страницу.';
        });
      } else show('login');
    })();
  </script>
